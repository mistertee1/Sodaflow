name: Deploy Firebase rules
on:
  workflow_dispatch:
    inputs:
      super_admin_uid:
        description: 'Optional exact verified Firebase UID for technical Super Admin bootstrap'
        required: false
        type: string
      super_admin_email:
        description: 'Exact verified mailbox, required when bootstrapping the exclusive administrator'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"
      - name: Check Firestore access before activation
        run: npm run billing:readiness
      - name: Preview billing migration
        env:
          BILLING_SIGNING_SECRET: ${{ secrets.BILLING_SIGNING_SECRET }}
        run: npm run billing:migrate
      - name: Initialize plans and migrate canonical subscriptions
        env:
          BILLING_SIGNING_SECRET: ${{ secrets.BILLING_SIGNING_SECRET }}
        run: npm run billing:migrate -- --apply
      - name: Bootstrap the explicitly supplied administrator
        if: inputs.super_admin_uid != ''
        env:
          SUPER_ADMIN_UID: ${{ inputs.super_admin_uid }}
          SUPER_ADMIN_EMAIL: ${{ inputs.super_admin_email }}
        run: |
          node --import tsx scripts/bootstrap-platform-admin.ts --uid "$SUPER_ADMIN_UID" > "$RUNNER_TEMP/platform-admin-preview.json"
          REVIEW_HASH=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).reviewHash)' "$RUNNER_TEMP/platform-admin-preview.json")
          node --import tsx scripts/bootstrap-platform-admin.ts --uid "$SUPER_ADMIN_UID" --apply --review-hash "$REVIEW_HASH"
      - name: Deploy Firestore rules and indexes
        run: npm run deploy:firebase:rules
