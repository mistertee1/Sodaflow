# Frontend and the authenticated operations API deploy together.
[build]
  command = "npx vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "serverless-http"]

[[redirects]]
  from = "/super-admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/super-admin/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "web-share=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
